  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'Fira Code', monospace;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Code Section Highlighting */
    .code-section {
      transition: all 0.2s ease-in-out;
      border-left: 3px solid transparent;
      margin: 2px 0;
      border-radius: 0 6px 6px 0;
    }

    .code-section.active-section {
      background-color: rgba(59, 130, 246, 0.18) !important;
      border-left-color: #3b82f6 !important;
    }

    .code-section.highlight-all-active {
      background-color: rgba(59, 130, 246, 0.08);
      border-left-color: rgba(59, 130, 246, 0.4);
    }

    /* Translation Card Highlighting */
    .translation-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .translation-card.active-card {
      border-color: #3b82f6 !important;
      background-color: #1e293b !important;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25), 0 8px 10px -6px rgba(59, 130, 246, 0.2);
      transform: translateY(-2px);
    }

    /* Line Numbers */
    .line-number {
      user-select: none;
      color: #475569;
      text-align: right;
      padding-right: 1rem;
      display: inline-block;
      width: 3.2rem;
      flex-shrink: 0;
    }

    /* Java Token Highlighting Syntax */
    .j-kw { color: #f43f5e; font-weight: 500; }     /* Keywords (public, class, int) */
    .j-str { color: #34d399; }                       /* Strings */
    .j-num { color: #fbbf24; }                       /* Numbers */
    .j-cmt { color: #64748b; font-style: italic; }  /* Comments */
    .j-fn { color: #60a5fa; }                        /* Methods */
    .j-cls { color: #a78bfa; }                       /* Classes */

    /* How It Works Mode */
    #toggle-how.how-toggle-on {
      background-color: #7c3aed;
      border-color: #8b5cf6;
      color: #ffffff;
    }
    #toggle-how.how-toggle-on:hover {
      background-color: #8b5cf6;
    }

    /* Hidden until the mode is switched on */
    body:not(.how-on) .how-wrap {
      display: none;
    }

    .how-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.65rem;
      border-radius: 0.5rem;
      font-size: 11px;
      font-weight: 500;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      transition: background-color 0.2s, border-color 0.2s;
    }
    .how-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.5);
    }
    .how-btn:focus-visible {
      outline: 2px solid #8b5cf6;
      outline-offset: 2px;
    }
    .how-chevron {
      transition: transform 0.25s ease;
    }
    .how-btn[aria-expanded="true"] .how-chevron {
      transform: rotate(180deg);
    }

    /* Smooth open/close without fixed heights */
    .how-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s ease;
    }
    .how-panel.open {
      grid-template-rows: 1fr;
    }
    .how-inner {
      min-height: 0;
      overflow: hidden;
      visibility: hidden;
      transition: visibility 0s linear 0.28s;
    }
    .how-panel.open .how-inner {
      visibility: visible;
      transition-delay: 0s;
    }

    .how-body {
      margin-top: 0.6rem;
      padding: 0.75rem;
      border-radius: 0.6rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .how-step-num {
      flex: none;
      width: 1.25rem;
      height: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .how-code {
      font-family: 'Fira Code', monospace;
      font-size: 0.7rem;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0 0.3rem;
      border-radius: 0.3rem;
      overflow-wrap: anywhere;
    }
    .how-note {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.65rem;
      border-radius: 0.5rem;
      font-size: 11px;
      line-height: 1.5;
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .how-note i {
      margin-top: 2px;
      font-size: 10px;
    }
    .how-note .how-code {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
    }

    @media (prefers-reduced-motion: reduce) {
      .how-panel, .how-inner, .how-chevron, .how-btn {
        transition: none;
      }
    }
  </style>

        startLine: 230,
        code: `                case 4: {
                    // Rank order
                    int[] order = new int[teamCount];
                    for (int i = 0; i < teamCount; i++) {
                        order[i] = i;
                    }

                    // Bubble sort
                    for (int i = 0; i < teamCount - 1; i++) {
                        for (int j = 0; j < teamCount - 1 - i; j++) {
                            int a = order[j];
                            int b = order[j + 1];
                            int diffA = pointsScored[a] - pointsAllowed[a];
                            int diffB = pointsScored[b] - pointsAllowed[b];

                            // Wins, then diff
                            if (wins[b] > wins[a] || (wins[b] == wins[a] && diffB > diffA)) {
                                order[j] = b;
                                order[j + 1] = a;
                            }
                        }
                    }

                    // Print table
                    System.out.println();
                    System.out.println("--League Standings--");
                    System.out.printf("%-16s%5s%5s%5s%7s%7s%7s%n",
                            "Team", "GP", "W", "L", "PF", "PA", "DIFF");
                    for (int i = 0; i < teamCount; i++) {
                        int t = order[i];
                        int gp = wins[t] + losses[t];
                        int diff = pointsScored[t] - pointsAllowed[t];
                        System.out.printf("%-16s%5d%5d%5d%7d%7d%+7d%n",
                                teamNames[t], gp, wins[t], losses[t],
                                pointsScored[t], pointsAllowed[t], diff);
                    }

                    // Show leader
                    System.out.println();
                    if (leaderCount == 1) {
                        System.out.println("Current League Leader: " + leaders);
                        System.out.println("Record: " + maxWins + "W - " + losses[leaderIndex] + "L");
                    } else {
                        System.out.println("League Leaders (tied):");
                        for (int i = 0; i < teamCount; i++) {
                            if (wins[i] == maxWins) {
                                System.out.println(teamNames[i] + " - " + maxWins + "W");
                            }
                        }
                    }
                    break;
                }`,
        explanation: "Sorts teams using a Bubble Sort algorithm based on total wins. If wins are tied, it uses point differential as the tie-breaker before displaying a formatted standings table."
      },
      {

        tagBg: "bg-teal-500/10 text-teal-400 border-teal-500/20",
        icon: "fa-chart-column",
        lines: "Lines 284–326",
        startLine: 284,
        code: `                case 5: {
                    // Totals and bests
                    int totalPoints = 0;
                    int bestOffense = 0;
                    int bestDefense = -1;
                    for (int i = 0; i < teamCount; i++) {
                        totalPoints = totalPoints + pointsScored[i];

                        if (pointsScored[i] > pointsScored[bestOffense]) {

                        // Skip unplayed

        explanation: "Generates league-wide macro statistics: totals all points scored across all matches, identifies the best offense (highest points scored), and best defense (fewest points allowed)."
      },
      {

        tag: "System",

}`,

    ];

    // How It Works Data (backticks = code chip)
    const HOW_IT_WORKS = {

    // State Variables
    let lockedSectionId = null;
    let isHighlightAll = false;
    let isHowMode = false;
    const openHowIds = new Set();

    // Syntax Highlighter Helper for Java
    function syntaxHighlightJava(code) {
      // Escape HTML
      let html = code
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Replace Comments
      html = html.replace(/(\/\/.*)/g, '<span class="j-cmt">$1</span>');

      // Replace Strings
      html = html.replace(/("[^"]*")/g, '<span class="j-str">$1</span>');

      // Replace Keywords
      const keywords = ['import', 'public', 'class', 'static', 'void', 'int', 'double', 'boolean', 'true', 'false', 'new', 'while', 'for', 'if', 'else', 'switch', 'case', 'break', 'continue', 'default'];
      keywords.forEach(kw => {
        const regex = new RegExp(`\\b(${kw})\\b`, 'g');
        html = html.replace(regex, '<span class="j-kw">$1</span>');
      });

      // Replace Built-in Classes
      const classes = ['Main', 'Scanner', 'System', 'String'];
      classes.forEach(cls => {
        const regex = new RegExp(`\\b(${cls})\\b`, 'g');
        html = html.replace(regex, '<span class="j-cls">$1</span>');
      });

      // Replace Common Methods
      html = html.replace(/\.(println|print|printf|nextInt|nextLine|close)\b/g, '.<span class="j-fn">$1</span>');

      // Replace Numbers
      html = html.replace(/\b(\d+)\b/g, '<span class="j-num">$1</span>');

      return html;
    }

    // Escape text, turn `code` into chips
    function formatHowText(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/`([^`]+)`/g, '<code class="how-code">$1</code>');
    }

    // Build button + steps for one card
    function buildHowHtml(id) {
      const how = HOW_IT_WORKS[id];
      if (!how) return "";
      const isOpen = openHowIds.has(id);

      const steps = how.steps.map((step, i) => `
        <li class="flex gap-2.5">
          <span class="how-step-num">${i + 1}</span>
          <span class="flex-1 text-xs text-slate-300 leading-relaxed">${formatHowText(step)}</span>
        </li>
      `).join("");

      const note = how.note ? `
        <div class="how-note">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>${formatHowText(how.note)}</span>
        </div>
      ` : "";

      return `
        <div class="how-wrap mt-3">
          <button type="button" class="how-btn" data-how-id="${id}" aria-expanded="${isOpen}" aria-controls="how-panel-${id}">
            <i class="fa-solid fa-lightbulb text-[10px]"></i>
            <span class="how-btn-label">${isOpen ? "Hide how it works" : "How does it work?"}</span>
            <i class="fa-solid fa-chevron-down how-chevron text-[9px]"></i>
          </button>
          <div id="how-panel-${id}" class="how-panel ${isOpen ? "open" : ""}">
            <div class="how-inner">
              <div class="how-body">
                <ol class="space-y-2">${steps}</ol>
                ${note}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Open or close one panel
    function toggleHow(id) {
      const panel = document.getElementById(`how-panel-${id}`);
      const btn = document.querySelector(`.how-btn[data-how-id="${id}"]`);
      if (!panel || !btn) return;

      const willOpen = !panel.classList.contains("open");
      panel.classList.toggle("open", willOpen);
      btn.setAttribute("aria-expanded", String(willOpen));
      btn.querySelector(".how-btn-label").textContent = willOpen ? "Hide how it works" : "How does it work?";

      if (willOpen) {
        openHowIds.add(id);
        setActiveSection(id, true, false); // Show code
      } else {
        openHowIds.delete(id);
      }
    }

    // DOM Elements
    const codeContainer = document.getElementById("code-container");
    const explanationContainer = document.getElementById("explanation-container");
    const searchInput = document.getElementById("search-input");
    const sectionBadge = document.getElementById("section-badge");
    const lockBadge = document.getElementById("lock-badge");
    const unlockBtn = document.getElementById("unlock-btn");
    const toggleHighlightAllBtn = document.getElementById("toggle-highlight-all");
    const highlightAllText = document.getElementById("highlight-all-text");
    const toggleHowBtn = document.getElementById("toggle-how");
    const howText = document.getElementById("how-text");
    const copyBtn = document.getElementById("copy-btn");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");

    // Initialize Render
    window.addEventListener("DOMContentLoaded", () => {
      renderApp();
      setupGlobalEvents();
    });

    function renderApp(filterText = "") {
      codeContainer.innerHTML = "";
      explanationContainer.innerHTML = "";

      const filtered = SECTIONS.filter(sec => {
        if (!filterText) return true;
        const q = filterText.toLowerCase();
        return (
          sec.title.toLowerCase().includes(q) ||
          sec.explanation.toLowerCase().includes(q) ||
          sec.tag.toLowerCase().includes(q) ||
          sec.code.toLowerCase().includes(q)
        );
      });

      sectionBadge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Section' : 'Sections'}`;

      if (filtered.length === 0) {
        explanationContainer.innerHTML = `
          <div class="p-8 text-center text-slate-500">
            <i class="fa-solid fa-magnifying-glass text-2xl mb-2"></i>
            <p class="text-xs">No matching code or explanation found for "${filterText}"</p>
          </div>
        `;
        codeContainer.innerHTML = `
          <div class="p-8 text-center text-slate-500">
            <p class="text-xs">No code matches search filter.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((sec) => {
        // Build Code Block
        const codeBlock = document.createElement("div");
        codeBlock.id = `code-${sec.id}`;
        codeBlock.className = `code-section cursor-pointer ${isHighlightAll ? 'highlight-all-active' : ''}`;
        codeBlock.dataset.id = sec.id;

        const lines = sec.code.split("\n");
        let formattedLines = "";
        let lineNum = sec.startLine;

        lines.forEach((line) => {
          const highlighted = syntaxHighlightJava(line || " ");
          formattedLines += `
            <div class="flex hover:bg-slate-800/40 px-1 py-0.5 rounded">
              <span class="line-number">${lineNum++}</span>
              <span class="flex-1 overflow-x-auto whitespace-pre">${highlighted}</span>
            </div>
          `;
        });

        codeBlock.innerHTML = `
          <div class="text-[10px] text-slate-500 flex items-center justify-between mb-1 px-2 pt-1 border-b border-slate-800/40 select-none">
            <span class="font-sans font-semibold text-slate-400">${sec.title}</span>
            <span class="text-[10px] text-slate-500">${sec.lines}</span>
          </div>
          <div>${formattedLines}</div>
        `;

        codeContainer.appendChild(codeBlock);

        // Build Explanation Card
        const card = document.createElement("div");
        card.id = `card-${sec.id}`;
        card.className = "translation-card bg-slate-950/80 border border-slate-800 rounded-xl p-4 cursor-pointer relative group hover:border-slate-700";
        card.dataset.id = sec.id;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="text-xs font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid ${sec.icon} text-blue-400"></i>
              ${sec.title}
            </span>
            <span class="text-[10px] px-2 py-0.5 rounded-full border ${sec.tagBg} font-medium">
              ${sec.tag}
            </span>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed">${sec.explanation}</p>
          ${buildHowHtml(sec.id)}
          <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-500">
            <span><i class="fa-regular fa-bookmark mr-1"></i>${sec.lines}</span>
            <span class="text-blue-400/80 group-hover:text-blue-400 transition font-medium flex items-center gap-1">
              Locate code <i class="fa-solid fa-chevron-right text-[9px]"></i>
            </span>
          </div>
        `;

        explanationContainer.appendChild(card);
      });

      attachInteractions();
    }

    function setActiveSection(sectionId, scrollCode = false, scrollCard = false) {
      if (lockedSectionId && lockedSectionId !== sectionId) return;

      // Clear previous actives
      document.querySelectorAll(".active-section").forEach(el => el.classList.remove("active-section"));
      document.querySelectorAll(".active-card").forEach(el => el.classList.remove("active-card"));

      if (!sectionId) return;

      const targetCode = document.getElementById(`code-${sectionId}`);
      const targetCard = document.getElementById(`card-${sectionId}`);

      if (targetCode) {
        targetCode.classList.add("active-section");
        if (scrollCode) {
          targetCode.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      if (targetCard) {
        targetCard.classList.add("active-card");
        if (scrollCard) {
          targetCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }
    }

    function lockSection(sectionId) {
      if (lockedSectionId === sectionId) {
        unlockSelection();
        return;
      }

      lockedSectionId = sectionId;
      lockBadge.classList.remove("hidden");
      lockBadge.classList.add("flex");
      unlockBtn.classList.remove("hidden");

      setActiveSection(sectionId, true, true);
      showToast("Selection locked! Click 'Unlock' or click again to release.");
    }

    function unlockSelection() {
      lockedSectionId = null;
      lockBadge.classList.add("hidden");
      lockBadge.classList.remove("flex");
      unlockBtn.classList.add("hidden");

      document.querySelectorAll(".active-section").forEach(el => el.classList.remove("active-section"));
      document.querySelectorAll(".active-card").forEach(el => el.classList.remove("active-card"));
    }

    function attachInteractions() {
      const codeBlocks = document.querySelectorAll(".code-section");
      const cards = document.querySelectorAll(".translation-card");

      codeBlocks.forEach(block => {
        const id = block.dataset.id;
        block.addEventListener("mouseenter", () => {
          if (!lockedSectionId) setActiveSection(id, false, true);
        });
        block.addEventListener("mouseleave", () => {
          if (!lockedSectionId) setActiveSection(null);
        });
        block.addEventListener("click", () => lockSection(id));
      });

      cards.forEach(card => {
        const id = card.dataset.id;
        card.addEventListener("mouseenter", () => {
          if (!lockedSectionId) setActiveSection(id, false, false);
        });
        card.addEventListener("mouseleave", () => {
          if (!lockedSectionId) setActiveSection(null);
        });
        card.addEventListener("click", () => lockSection(id));
      });

      // How It Works buttons (don't lock the card)
      document.querySelectorAll(".how-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleHow(btn.dataset.howId);
        });
      });

      // Reading the steps shouldn't lock the card either
      document.querySelectorAll(".how-panel").forEach(panel => {
        panel.addEventListener("click", (e) => e.stopPropagation());
      });
    }

    function setupGlobalEvents() {
      // Search Event
      searchInput.addEventListener("input", (e) => {
        unlockSelection();
        renderApp(e.target.value);
      });

      // Unlock Button
      unlockBtn.addEventListener("click", unlockSelection);

      // Toggle Highlight All
      toggleHighlightAllBtn.addEventListener("click", () => {
        isHighlightAll = !isHighlightAll;
        if (isHighlightAll) {
          toggleHighlightAllBtn.classList.add("bg-blue-600", "text-white", "border-blue-500");
          toggleHighlightAllBtn.classList.remove("bg-slate-800", "text-slate-300", "border-slate-700");
          highlightAllText.textContent = "Highlight Active";
        } else {
          toggleHighlightAllBtn.classList.remove("bg-blue-600", "text-white", "border-blue-500");
          toggleHighlightAllBtn.classList.add("bg-slate-800", "text-slate-300", "border-slate-700");
          highlightAllText.textContent = "Highlight All";
        }
        renderApp(searchInput.value);
      });

      // Toggle How It Works Mode
      toggleHowBtn.addEventListener("click", () => {
        isHowMode = !isHowMode;
        document.body.classList.toggle("how-on", isHowMode);
        toggleHowBtn.classList.toggle("how-toggle-on", isHowMode);
        toggleHowBtn.setAttribute("aria-pressed", String(isHowMode));
        howText.textContent = isHowMode ? "How It Works: On" : "How It Works: Off";
        showToast(isHowMode
          ? "How It Works mode on. Use the button on each section."
          : "How It Works mode off.");
      });

      // Copy Java Code to Clipboard
      copyBtn.addEventListener("click", () => {
        const fullCode = SECTIONS.map(s => s.code).join("\n\n");
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = fullCode;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        try {
          document.execCommand("copy");
          showToast("Full Java code copied to clipboard!");
        } catch (err) {
          showToast("Failed to copy code.");
        }
        document.body.removeChild(tempTextArea);
      });
    }

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove("translate-y-16", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");

      setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-16", "opacity-0");
      }, 2500);
    }
  </script>
